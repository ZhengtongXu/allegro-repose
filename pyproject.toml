[project]
name = "allegro-repose"
version = "0.1.0"
description = "Fixed-wrist Allegro hand cube repose in mjlab (Isaac Lab Isaac-Repose-Cube-Allegro-Direct-v0 adapted to MuJoCo Warp), trained with PPO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "mjlab==1.5.3",
    "rsl-rl-lib==5.4.0",
    "torch==2.10.0",
    "wandb>=0.24",
    "pyyaml>=6.0",
    "numpy<2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allegro_repose"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
